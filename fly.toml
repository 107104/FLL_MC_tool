
# Colorado FLL GA Tool - Fly.io Configuration

app = "fll-mc-tool"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  GA_DB_PATH = "/app/data/ga.sqlite3"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "ga_data"
  destination = "/app/data"
